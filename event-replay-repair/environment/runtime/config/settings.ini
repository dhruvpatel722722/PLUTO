[sources]
data_directory = /app/runtime/data
output_directory = /app/runtime/output
stream_format = jsonl

[sources.filter]
accepted_types = order_placed,payment_received,inventory_adjusted, shipment_dispatched
reject_stale_seconds = 3600

[replay]
mode = sequential
batch_size = 50
ordering = timestamp_first

[replay.engine]
batch_size = 10
snapshot_interval = 5
accumulation_mode = replace

[output]
projections_file = projections.json
summary_file = replay_summary.json
format = json
