[sensors]
# Active sensor feeds to process
active_feeds = gps_north,gps_south,gps_east, beacon_west

[zones]
# Geofence zone definitions (id:lat_min:lat_max:lon_min:lon_max)
warehouse_a = 40.700:40.710:−74.020:−74.010
warehouse_b = 40.720:40.730:−74.040:−74.030
loading_dock = 40.711:40.719:−74.025:−74.015

[alerting]
# General alerting config
dwell_threshold_sec = 300
cooldown_sec = 60
max_alerts_per_window = 50

[alerting.realtime]
# Realtime alerting uses tighter thresholds
dwell_threshold_sec = 25
cooldown_sec = 30
max_alerts_per_window = 20

[processing]
batch_size = 15
time_window_sec = 60
# Note: event sequence numbers are local to each sensor stream
dedup_window_sec = 5
