[sources]
data_directory = /app/runtime/data
output_directory = /app/runtime/output
accepted_event_types = order_placed,payment_received,inventory_adjusted, shipment_dispatched

[replay]
batch_size = 50
mode = sequential

[replay.projection]
batch_size = 10
snapshot_interval = 5

[output]
projections_file = projections.json
summary_file = replay_summary.json
