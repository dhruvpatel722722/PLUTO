[acquisition]
data_directory = /app/runtime/data
sample_rate = 1000
channels = north,south,east, west

[processing]
window_size = 64
overlap_ratio = 0.5
normalization = rms

[processing.window]
normalization = none
apply_hanning = false

[processing.filter]
type = bandpass
low_cutoff = 10
high_cutoff = 200
order = 4

[analysis]
aggregation = mean
threshold_sigma = 2.5
merge_window_ms = 50

[analysis.detector]
aggregation = median
threshold_sigma = 1.5
merge_window_ms = 25
min_duration_ms = 10

[output]
output_directory = /app/runtime/output
detections_file = detections.json
summary_file = processing_summary.json
